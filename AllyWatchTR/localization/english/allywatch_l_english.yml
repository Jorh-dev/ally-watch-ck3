 allywatch.0001.slot6:0 "@alliance_icon! [allywatch_slot6.GetShortUIName] — #V [allywatch_slot6.MakeScope.ScriptValue('allywatch_ally_count')|0]#! müttefik"
 allywatch.0001.next_page:0 "Sonraki altı kişi"
