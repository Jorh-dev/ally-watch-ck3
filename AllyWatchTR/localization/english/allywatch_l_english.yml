 allywatch.0001.close:0 "Kapat"

 allywatch.0002.t:0 "[allywatch_watched.GetShortUINameNoTooltip]"
 allywatch.0002.desc_intro:0 "[allywatch_watched.GetUINameNoTooltip] şu anda #V [allywatch_watched.MakeScope.ScriptValue('allywatch_ally_count')|0]#! müttefiğe sahip.\n"
 allywatch.0002.desc_thr_none:0 "Bildirim: #V her müttefik değişikliğinde#!.\nSadece iyice yalnız kalınca haber almak istersen daha geç haber ver de."
 allywatch.0002.desc_thr_0:0 "Bildirim: #V sadece hiç müttefiği kalmayınca#!.\nOndan öncesi sessiz geçer."
 allywatch.0002.desc_thr_1:0 "Bildirim: #V tek müttefiği kalınca#!.\nÜstündeki değişiklikler sessiz geçer."
 allywatch.0002.desc_thr_2:0 "Bildirim: #V 2 veya daha az müttefiği kalınca#!.\nÜstündeki değişiklikler sessiz geçer."
 allywatch.0002.desc_thr_3:0 "Bildirim: #V 3 veya daha az müttefiği kalınca#!.\nÜstündeki değişiklikler sessiz geçer."
